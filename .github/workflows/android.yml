name: Build Android signed APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build:static

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify live wallpaper service
        run: test -f android/app/src/main/java/com/daldal/calendar/DaldalLiveWallpaperService.java && grep -q "android.service.wallpaper.WallpaperService" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK with live wallpaper
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daldal-calendar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: ${{ secrets.DALDAL_KEYSTORE_BASE64 != '' }}
        env:
          DALDAL_KEYSTORE_BASE64: ${{ secrets.DALDAL_KEYSTORE_BASE64 }}
        run: |
          echo "$DALDAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daldal-release-key.jks"
          test -s "$RUNNER_TEMP/daldal-release-key.jks"

      - name: Build signed release APK and Play AAB
        if: ${{ secrets.DALDAL_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          DALDAL_KEYSTORE_FILE: ${{ runner.temp }}/daldal-release-key.jks
          DALDAL_KEYSTORE_PASSWORD: ${{ secrets.DALDAL_KEYSTORE_PASSWORD }}
          DALDAL_KEY_ALIAS: ${{ secrets.DALDAL_KEY_ALIAS }}
          DALDAL_KEY_PASSWORD: ${{ secrets.DALDAL_KEY_PASSWORD }}
          DALDAL_VERSION_CODE: ${{ github.run_number }}
          DALDAL_VERSION_NAME: "1.5.${{ github.run_number }}"
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed APK and AAB artifacts
        if: ${{ secrets.DALDAL_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: daldal-calendar-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
